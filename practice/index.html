<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="description" content="2月の学内 TOEFL ITP に向けた、毎日1分のショートと10問の練習。">
<title>練習一覧 | 1日1分TOEFL</title>
<style>
:root{color-scheme:light dark;--bg:#fff;--panel:#f2f6fa;--fg:#1f2328;--muted:#5e6670;--line:#c6d3e0;--brand:#043c78;--on-brand:#fff;--selected:#e6eff9;--danger:#a33427;font-family:"A-OTF UD Shin Go Pr6N",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:16px;font-weight:500;line-height:1.6}
@media(prefers-color-scheme:dark){:root{--bg:#141b24;--panel:#1d2835;--fg:#eef3fa;--muted:#afbed0;--line:#4b5c70;--brand:#9dc7ff;--on-brand:#10263f;--selected:#253e5c;--danger:#ffb5a9}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg)}button,input,textarea{font:inherit}button{cursor:pointer}button:disabled{cursor:default;opacity:.55}button:focus-visible,input:focus-visible,textarea:focus-visible,summary:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--brand);outline-offset:4px}h1,h2,h3,p,ul,ol,dl,dd,pre{margin:0}h1,h2,h3{line-height:1.3;letter-spacing:-.02em;font-weight:700}h1{font-size:clamp(28px,5vw,40px)}h2{font-size:28px}h3{font-size:20px}p,li,button,pre{overflow-wrap:anywhere}a{color:var(--brand)}[hidden]{display:none!important}.shell{width:min(1120px,100%);margin-inline:auto;padding:32px 16px 64px}.top{display:flex;justify-content:space-between;align-items:center;gap:16px;padding-bottom:32px}.wordmark{font-size:14px;font-weight:700;letter-spacing:.05em}.muted,.small{color:var(--muted)}.small{font-size:14px}.stack{display:grid;gap:16px}.large-gap{gap:32px}.cover{max-width:720px;padding-block:32px}.eyebrow{font-weight:700;color:var(--brand)}.intro{font-size:18px}.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;padding-block:16px}.fact strong{display:block;font-size:24px}.fact span{font-size:14px;color:var(--muted)}.primary,.secondary{border:1px solid var(--brand);border-radius:4px;padding:12px 24px;min-height:48px;font-weight:700}.primary{background:var(--brand);color:var(--on-brand)}.secondary{background:transparent;color:var(--brand)}.actions{display:flex;flex-wrap:wrap;gap:16px;align-items:center}.notice{padding:16px;background:var(--panel)}.error{color:var(--danger)}.section-head{display:grid;gap:16px;padding-bottom:32px}.section-meta{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}.section-title{display:flex;justify-content:space-between;gap:16px;align-items:baseline}.progress{width:100%;height:4px;background:var(--line);border:0}.progress::-webkit-progress-bar{background:var(--line)}.progress::-webkit-progress-value{background:var(--brand)}.progress::-moz-progress-bar{background:var(--brand)}.question-layout{display:grid;gap:32px}.question-pane{display:grid;gap:24px;align-content:start;min-width:0}.question-title{font-size:20px}.english{line-height:1.9}.blank{display:inline-block;min-width:5em;border-bottom:2px solid currentColor;line-height:1.2}.marked{display:inline-grid;grid-template-rows:auto auto;vertical-align:middle;text-align:center;line-height:1.3}.marked u{text-decoration-thickness:1px;text-underline-offset:4px}.part-label{font-size:12px;line-height:1.8;color:var(--muted)}fieldset{margin:0;padding:0;border:0;min-width:0;display:grid;gap:16px}.choice{display:flex;align-items:baseline;gap:16px;padding:16px;border:1px solid var(--line);border-radius:4px;cursor:pointer;line-height:1.6;min-height:56px}.choice:has(input:checked){border-color:var(--brand);background:var(--selected);outline:1px solid var(--brand)}.choice input{accent-color:var(--brand);flex:0 0 auto}.choice-letter{font-weight:700;flex:0 0 auto}.choice-text{min-width:0}.passage{background:var(--panel);padding:24px;display:grid;gap:16px;align-content:start;min-width:0}.passage-copy{display:grid;gap:16px;overflow:auto;max-height:40svh;overscroll-behavior:contain;scrollbar-gutter:stable}.passage-copy p{line-height:1.85}.passage-number{font-size:12px;color:var(--muted);padding-right:8px}.listening-tools{display:grid;gap:8px;justify-items:start}.next-row{display:flex;justify-content:flex-end;gap:16px;padding-top:8px}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}.results{display:grid;gap:32px}.score-list{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:32px}.score{display:grid;gap:8px;border-top:2px solid var(--brand);padding-top:16px}.score strong{font-size:32px;line-height:1.3}.score h2{font-size:18px}.review-item{display:grid;gap:16px;border-top:1px solid var(--line);padding-block:24px}.answers{display:grid;gap:8px}.answers>div{display:grid;grid-template-columns:7em 1fr;gap:16px}.answers dt{color:var(--muted)}.review-choices{padding-left:24px}.transcript{display:grid;gap:8px;padding:16px;background:var(--panel)}.script-line{white-space:pre-wrap;line-height:1.8}.curriculum{padding-left:24px;display:grid;gap:8px}summary{cursor:pointer;font-weight:700;min-height:44px;display:flex;align-items:center}.copy-text{width:100%;min-height:180px;padding:16px;background:var(--panel);color:var(--fg);border:1px solid var(--line)}.between{max-width:720px;padding-top:32px}.footer{padding-top:32px;font-size:14px;color:var(--muted)}
.reading-layout .passage{position:sticky;top:0;z-index:1;align-self:start}
@media(min-width:800px){.reading-layout{grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);align-items:start}.reading-layout .passage{position:sticky;top:16px}.reading-layout .passage-copy{max-height:calc(100svh - 160px)}}
@media(max-width:540px){.shell{padding-top:16px}.top{padding-bottom:16px}.facts{gap:8px}.fact strong{font-size:20px}.fact span{font-size:12px}.score-list{grid-template-columns:1fr;gap:24px}.score{grid-template-columns:1fr auto;align-items:baseline}.score .small{grid-column:1/-1}.passage{padding:16px}.choice{gap:8px}.section-head{padding-bottom:24px}.answers>div{grid-template-columns:1fr;gap:0}.actions button{flex:1 1 auto}.next-row .primary{width:100%}}
@media(prefers-reduced-motion:no-preference){button,.choice{transition:background-color .15s,border-color .15s}}

.site-nav{display:flex;flex-wrap:wrap;gap:8px 24px;padding-bottom:16px}.site-nav a{min-height:44px;display:flex;align-items:center}.site-nav [aria-current="page"]{font-weight:700}.primary-link{display:block;text-align:center;text-decoration:none;font-size:24px;padding:24px}.practice-list{list-style:none;padding:0}.info-table{width:100%;border-collapse:collapse;table-layout:fixed}.info-table th,.info-table td{text-align:left;vertical-align:top;padding:16px 8px;border-bottom:1px solid var(--line);overflow-wrap:anywhere}.info-table th{font-weight:700}a:focus-visible{outline:3px solid var(--brand);outline-offset:4px}
</style>
</head>
<body>
<div class="shell">
<header class="top"><a class="wordmark" href="../">1日1分TOEFL</a></header>
<nav class="site-nav" aria-label="サイト内のページ"><a href="../">トップ</a><a href="../practice/" aria-current="page">練習一覧</a><a href="../plan/">2月までの道のり</a><a href="../about/">TOEFL ITPとは</a></nav>
<main class="cover stack large-gap">
<h1>練習一覧</h1>
<ul class="practice-list"><li class="review-item"><h2>#01 節をつなぐ接続詞</h2><p>後ろに主語＋動詞があれば接続詞（although / because / while / when / before）。名詞だけなら前置詞（despite / because of / during / prior to）。</p><div class="actions"><a href="01/">練習ページ</a><a href="https://youtube.com/shorts/R5QsF6WrAL8">動画</a></div></li></ul>
</main>
<footer class="footer stack"><p>問題はすべてオリジナルです。ETS とは関係ありません。</p><a href="https://youtube.com/@toefl_1min">YouTubeチャンネル</a></footer>
</div>
</body>
</html>
