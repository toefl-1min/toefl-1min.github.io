<script id="practice-data" type="application/json">{"id":"02","title":"練習 #2 形容詞と副詞","type":"形容詞と副詞","pace_sec":37,"video":"https://youtube.com/shorts/6E2UOg0k9xY","rule":"名詞を説明するのは形容詞（rapid / careful）。be動詞や become・remain・seem の後ろも形容詞。動詞・形容詞・ほかの副詞を説明するのは副詞（形容詞に -ly を付けたものが多い: rapidly / carefully / extremely）。","note":"問題はすべてオリジナル。ETS の公式問題ではない。answer は choices の 0 始まりの添字。","items":[{"id":"P1","kind":"blank","stem":"The scientists ______ examined the ancient bones.","choices":["care","carefulness","careful","carefully"],"answer":3,"explain":"空欄は動詞 examined を説明している。動詞を説明するのは副詞の carefully。careful は形容詞で名詞にしか付かない。care は名詞・動詞、carefulness は名詞で、ここには入らない。"},{"id":"P2","kind":"blank","stem":"Honey can remain ______ for thousands of years.","choices":["edible","edibly","edibility","more edibly"],"answer":0,"explain":"remain は be動詞と同じで「〜のままでいる」。後ろには主語の様子を表す形容詞が来る。edibly は副詞なので remain の後ろに置けない。"},{"id":"P3","kind":"blank","stem":"The population of the town increased ______ after the railroad arrived.","choices":["steadily","steadies","steadiness","steadied"],"answer":0,"explain":"空欄は動詞 increased を説明している。だから副詞の steadily。steadies・steadied は動詞、steadiness は名詞。"},{"id":"P4","kind":"blank","stem":"The desert is ______ dry during the summer months.","choices":["extreme","extremity","extremely","more extreme"],"answer":2,"explain":"空欄は形容詞 dry を説明している。形容詞を説明するのは副詞の extremely。extreme は形容詞なので dry の前に並べられない。"},{"id":"P5","kind":"blank","stem":"Bamboo is a ______ plant that can grow almost a meter in a day.","choices":["remarkably","remarkable","remark","remarking"],"answer":1,"explain":"空欄は名詞 plant を説明している。名詞を説明するのは形容詞の remarkable。remarkably は副詞で、名詞の前には置けない。"},{"id":"P6","kind":"blank","stem":"The professor explained the theory so ______ that everyone understood it.","choices":["simplify","simplicity","simpler","simply"],"answer":3,"explain":"空欄は動詞 explained を説明している（どう説明したか）。だから副詞の simply。simplify は動詞、simplicity は名詞、simpler は形容詞の比較級。"},{"id":"P7","kind":"blank","stem":"Many early maps were ______ inaccurate.","choices":["surprising","surprised","surprisingly","surprise"],"answer":2,"explain":"空欄は形容詞 inaccurate を説明している。形容詞を説明するのは副詞の surprisingly。surprising・surprised は形容詞なので、形容詞の前に並べられない。"},{"id":"P8","kind":"error","parts":["The ",{"u":"new"}," library was ",{"u":"careful"}," designed to let ",{"u":"natural"}," light ",{"u":"fill"}," the rooms."],"choices":["new","careful","natural","fill"],"answer":1,"explain":"careful が説明しているのは動詞の designed。動詞を説明するのは副詞なので carefully にする。new と natural は名詞（library・light）を説明する形容詞で正しい。"},{"id":"P9","kind":"error","parts":["Some frogs ",{"u":"survive"}," the winter ",{"u":"because"}," their bodies freeze ",{"u":"gradual"}," in the ",{"u":"cold"},"."],"choices":["survive","because","gradual","cold"],"answer":2,"explain":"gradual が説明しているのは動詞の freeze。動詞を説明するのは副詞なので gradually にする。in the cold の cold は「寒さ」という名詞で正しい。"},{"id":"P10","kind":"error","parts":["The water in the lake ",{"u":"remained"}," ",{"u":"calmly"}," ",{"u":"throughout"}," the ",{"u":"entire"}," day."],"choices":["remained","calmly","throughout","entire"],"answer":1,"explain":"remain は be動詞と同じで、後ろに主語の様子を表す形容詞が来る。calmly ではなく calm にする。entire は名詞 day を説明する形容詞で正しい。"}]}</script>
<script>
'use strict';
const DATA=JSON.parse(document.getElementById('practice-data').textContent);
const KEY='toefl-practice-'+DATA.id+'-d9addf1980fe74b3';
const LETTERS=['A','B','C','D'];
const app=document.getElementById('app');
let state, anchor=null;
function el(tag,attrs={},text){const n=document.createElement(tag);for(const [k,v] of Object.entries(attrs))n.setAttribute(k,v);if(text!==undefined)n.textContent=text;return n;}
function btn(text,handler,cls='primary'){const b=el('button',{type:'button',class:cls},text);b.addEventListener('click',handler);return b;}
function heading(tag,text){return el(tag,{tabindex:'-1','data-focus':''},text);}
function localDate(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function fresh(){return {schema:1,phase:'cover',index:0,answers:[],elapsed:0,date:localDate()};}
function valid(s){
 if(!s||s.schema!==1||!['cover','active','results'].includes(s.phase))return false;
 if(!Number.isInteger(s.index)||s.index<0||s.index>=DATA.items.length||!Array.isArray(s.answers))return false;
 if(!Number.isFinite(s.elapsed)||s.elapsed<0||typeof s.date!=='string'||!/^\d{4}-\d{2}-\d{2}$/.test(s.date))return false;
 if(s.answers.length>DATA.items.length||s.answers.some((a,i)=>!a||!Number.isInteger(a.choice)||a.choice<0||a.choice>=DATA.items[i].choices.length||!Number.isFinite(a.seconds)||a.seconds<0))return false;
 if(s.phase==='cover')return s.index===0&&s.answers.length===0&&s.elapsed===0;
 if(s.phase==='results')return s.index===DATA.items.length-1&&s.answers.length===DATA.items.length;
 return s.answers.length===s.index||s.answers.length===s.index+1;
}
function storageFailed(){document.getElementById('storage-note').hidden=false;}
function load(){try{const raw=localStorage.getItem(KEY);if(raw){const s=JSON.parse(raw);if(valid(s))return s;}}catch(e){storageFailed();}return fresh();}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){storageFailed();}}
function timing(){return state.phase==='active'&&state.answers.length===state.index;}
function tick(){const now=performance.now();if(anchor!==null&&timing())state.elapsed+=Math.max(0,now-anchor)/1000;anchor=timing()&&!document.hidden?now:null;}
function continuationHint(q){return typeof q.question==='string'&&q.question.trim()&&!q.question.trim().endsWith('?')?el('p',{class:'small continuation-hint'},'（文の続きに合うものを選ぶ）'):null;}
function appendQuestion(target,q,cls='english question-title'){if(typeof q.question!=='string')return;target.append(el('p',{class:cls,lang:'en'},q.question));const hint=continuationHint(q);if(hint)target.append(hint);}
function appendPrompt(target,q){if(typeof q.question==='string')appendQuestion(target,q);else target.append(sentence(q));}
function sentence(q){const p=el('p',{class:'english question-title',lang:'en'});if(q.kind==='error'){let i=0;for(const part of q.parts){if(typeof part==='string')p.append(document.createTextNode(part));else{const span=el('span',{class:'marked'});span.append(el('u',{},part.u),el('span',{class:'part-label'},LETTERS[i++]));p.append(span);}}}else{q.stem.split('______').forEach((part,i)=>{if(i)p.append(el('span',{class:'blank','aria-label':'空欄'},' '));p.append(document.createTextNode(part));});}return p;}
function start(){state=fresh();state.phase='active';anchor=document.hidden?null:performance.now();save();render();}
function renderCover(){const box=el('section',{class:'cover stack large-gap'});box.append(heading('h1',DATA.title),el('p',{class:'intro'},DATA.rule),el('p',{},DATA.items.length+'問・1問'+DATA.pace_sec+'秒が本番のペース'),el('p',{class:'small'},'選ぶと正誤と解説が出ます。閉じている間や別のタブを見ている間は、計時しません。'),btn('始める',start),el('a',{href:'../../'},'入口に戻る'));app.append(box);}
function choose(index){if(!timing())return;tick();state.answers.push({choice:index,seconds:state.elapsed});anchor=null;save();render();}
function next(){if(state.answers.length!==state.index+1)return;if(state.index===DATA.items.length-1){state.phase='results';anchor=null;}else{state.index++;state.elapsed=0;anchor=document.hidden?null:performance.now();}save();render();}
function answerText(q,i){return LETTERS[i]+'. '+q.choices[i];}
function renderQuestion(){const q=DATA.items[state.index],a=state.answers[state.index];const box=el('section',{class:'stack large-gap'});const head=el('div',{class:'section-head'});head.append(el('p',{class:'small'},DATA.title),el('h1',{},'問題 '+q.id),el('p',{class:'small'},(state.index+1)+' / '+DATA.items.length+'問'),el('progress',{class:'progress',max:DATA.items.length,value:state.answers.length,'aria-label':'回答済み問題数'}));box.append(head);
 const pane=el('div',{class:'question-pane'});if(typeof q.question!=='string')pane.append(el('p',{class:'small'},q.kind==='error'?'下線A〜Dから、誤っているものを選んでください。':'空欄に入るものを選んでください。'));appendPrompt(pane,q);
 const field=el('fieldset');field.disabled=!!a;field.append(el('legend',{class:'sr-only'},'問題 '+q.id+' の選択肢'));q.choices.forEach((text,i)=>{const label=el('label',{class:'choice'}),input=el('input',{type:'radio',name:'answer',value:i});input.checked=a?.choice===i;input.addEventListener('change',()=>choose(i));label.append(input,el('span',{class:'choice-letter'},LETTERS[i]));if(q.kind!=='error')label.append(el('span',{class:'choice-text',lang:'en'},text));else input.setAttribute('aria-label',LETTERS[i]+': '+text);field.append(label);});pane.append(field);
 if(a){const ok=a.choice===q.answer;const feedback=el('section',{class:'notice stack','aria-label':'この問題の結果'});feedback.append(heading('h2',ok?'正解です':'不正解です'),el('p',{class:ok?'':'error'},'正解: '+answerText(q,q.answer)),el('p',{},q.explain),el('p',{class:'small'},'この問題 '+Math.round(a.seconds)+'秒（本番のペースは'+DATA.pace_sec+'秒）'));pane.append(feedback);const row=el('div',{class:'next-row'});row.append(btn(state.index===DATA.items.length-1?'結果を見る':'次へ',next));pane.append(row);}else pane.append(el('p',{id:'timer',class:'small',role:'timer'},'経過 '+Math.floor(state.elapsed)+'秒'));
 box.append(pane);app.append(box);if(!a)head.querySelector('h1').setAttribute('data-focus','');if(!a)head.querySelector('h1').setAttribute('tabindex','-1');}
function wrong(){return DATA.items.filter((q,i)=>state.answers[i].choice!==q.answer);}
function average(){return Math.round(state.answers.reduce((n,a)=>n+a.seconds,0)/DATA.items.length);}
function copyText(){return ['練習 #'+DATA.id+' '+DATA.type+' / '+state.date,state.answers.filter((a,i)=>a.choice===DATA.items[i].answer).length+'/'+DATA.items.length+'（平均 '+average()+'秒・本番 '+DATA.pace_sec+'秒）','間違えた: '+(wrong().map(q=>q.id).join(', ')||'なし')].join('\n');}
async function copyResult(){const status=document.getElementById('copy-status');try{await navigator.clipboard.writeText(copyText());status.textContent='結果をコピーしました。';}catch(e){status.textContent='自動でコピーできませんでした。下のテキストを選んでコピーしてください。';const area=document.getElementById('copy-fallback');area.hidden=false;area.value=copyText();area.focus();area.select();}}
function restart(){state=fresh();anchor=null;save();render();}
function renderResults(){const box=el('section',{class:'results'});box.append(heading('h1','練習結果'),el('p',{},DATA.title));const score=el('section',{class:'score'});score.append(el('h2',{},'正答数'),el('strong',{},state.answers.filter((a,i)=>a.choice===DATA.items[i].answer).length+'/'+DATA.items.length),el('p',{},'平均 '+average()+'秒（本番のペースは'+DATA.pace_sec+'秒）'));box.append(score);const actions=el('div',{class:'actions'});actions.append(btn('結果をコピー',copyResult),btn('もう一度',restart,'secondary'));box.append(actions,el('p',{id:'copy-status',class:'small',role:'status'}));const area=el('textarea',{id:'copy-fallback',class:'copy-text',readonly:'','aria-label':'コピー用の練習結果'});area.hidden=true;box.append(area);const review=el('section',{class:'stack'});review.append(el('h2',{},'間違えた問題'));if(!wrong().length)review.append(el('p',{},'間違えた問題はありません。'));for(const q of wrong()){const a=state.answers[DATA.items.indexOf(q)];const item=el('article',{class:'review-item'});item.append(el('h3',{},q.id));appendPrompt(item,q);const choices=el('ol',{class:'review-choices',type:'A',lang:'en'});for(const text of q.choices)choices.append(el('li',{},text));const answers=el('dl',{class:'answers'});for(const [label,value] of [['自分の答え',answerText(q,a.choice)],['正解',answerText(q,q.answer)]]){const pair=el('div');pair.append(el('dt',{},label),el('dd',{lang:'en'},value));answers.append(pair);}item.append(choices,answers,el('p',{},q.explain));review.append(item);}box.append(review);app.append(box);}
function render(){document.getElementById('footer-home').hidden=state.phase==='cover';app.replaceChildren();if(state.phase==='cover')renderCover();else if(state.phase==='results')renderResults();else renderQuestion();app.querySelector('[data-focus]')?.focus({preventScroll:true});}
function showTimer(){const timer=document.getElementById('timer');if(timer)timer.textContent='経過 '+Math.floor(state.elapsed)+'秒';}
document.addEventListener('visibilitychange',()=>{tick();save();});
window.addEventListener('pagehide',()=>{tick();anchor=null;save();});
window.addEventListener('pageshow',()=>{anchor=timing()&&!document.hidden?performance.now():null;});
state=load();anchor=timing()&&!document.hidden?performance.now():null;render();
setInterval(()=>{tick();showTimer();save();},1000);
</script>
