<script id="question-data" type="application/json">{"title":"TOEFL ITP 診断 30問","version":1,"note":"問題はすべてオリジナル。ETS の公式問題ではない。answer は choices の 0 始まりの添字。","sections":[{"id":"listening","title":"Listening","pace_sec":12,"instructions":"音声は本番と同じく1回だけ流れます。問題文も音声で読まれるので、画面には選択肢だけが出ます。","groups":[{"id":"L1","audio":"L1.mp3","script":[{"speaker":"M","text":"I can't believe how crowded the library is today."},{"speaker":"W","text":"Well, finals start next week, you know."},{"speaker":"N","text":"What does the woman imply?"}],"items":[{"id":"L1","type":"理由の言い換え","choices":["The library will close next week.","Many students are studying for exams.","She doesn't like studying in the library.","The man should take his finals early."],"answer":1,"explain":"「来週から期末試験」は、混んでいる理由を言っている。理由を直接言わずに状況だけ返すのは Part A の定番。"}]},{"id":"L2","audio":"L2.mp3","script":[{"speaker":"W","text":"My laptop keeps shutting down in the middle of my work."},{"speaker":"M","text":"Why don't you take it to the computer lab? They fix things like that for free."},{"speaker":"N","text":"What does the man suggest the woman do?"}],"items":[{"id":"L2","type":"提案の表現","choices":["Buy a new laptop.","Do her work in the computer lab.","Have her computer repaired on campus.","Save her work more often."],"answer":2,"explain":"Why don't you 〜? は「〜したら？」という提案。computer lab で直してもらう＝学内で修理。B は lab という同じ単語を使ったひっかけ。"}]},{"id":"L3","audio":"L3.mp3","script":[{"speaker":"M","text":"How did your presentation go this morning?"},{"speaker":"W","text":"It couldn't have gone better."},{"speaker":"N","text":"What does the woman mean?"}],"items":[{"id":"L3","type":"否定＋比較級","choices":["Her presentation went very well.","She could not give her presentation.","She wishes she had prepared more.","Her presentation was moved to the afternoon."],"answer":0,"explain":"couldn't have gone better は「これ以上よくはなりえなかった」＝最高だった。not と better が並ぶと悪い意味に聞こえるが逆。"}]},{"id":"L4","audio":"L4.mp3","script":[{"speaker":"W","text":"We've been working on this report for six hours."},{"speaker":"M","text":"Let's call it a day and finish it tomorrow."},{"speaker":"N","text":"What does the man suggest?"}],"items":[{"id":"L4","type":"慣用句","choices":["Calling their professor.","Finishing the report today.","Starting a new report.","Stopping work for now."],"answer":3,"explain":"call it a day は「今日はここまでにする」。call から A を選ばせるひっかけ。"}]},{"id":"L5","audio":"L5.mp3","script":[{"speaker":"M","text":"Did you go to the guest lecture on climate change last night?"},{"speaker":"W","text":"If I'd known about it, I would have."},{"speaker":"N","text":"What does the woman mean?"}],"items":[{"id":"L5","type":"仮定法","choices":["She went to the lecture.","She will go to the next lecture.","She did not know about the lecture.","She does not like lectures."],"answer":2,"explain":"If I'd known, I would have (gone). は「知っていたら行ったのに」＝実際は知らなかったし行っていない。仮定法は事実の逆を言う。"}]},{"id":"L6","audio":"L6.mp3","script":[{"speaker":"W","text":"Have you finished reading the article for Professor Lee's class?"},{"speaker":"M","text":"I've barely started."},{"speaker":"N","text":"What does the man mean?"}],"items":[{"id":"L6","type":"準否定語","choices":["He has just finished it.","He started it a long time ago.","He doesn't have the article.","He has read only a small part of it."],"answer":3,"explain":"barely は「ほとんど〜ない」。始めたばかりで、まだ少ししか読んでいない。hardly・scarcely も同じ仲間。"}]},{"id":"L7-10","audio":"L7-10.mp3","script":[{"speaker":"N","text":"Listen to part of a lecture in a biology class."},{"speaker":"P","text":"Today I want to talk about how some plants protect themselves without moving. Take the acacia tree in Africa. When giraffes start eating its leaves, the tree doesn't just stand there. Within minutes, it begins to produce a chemical called tannin, which makes the leaves taste bitter. But here's the interesting part. The tree also releases a gas into the air. Nearby acacia trees detect this gas and start producing tannin too, even before any giraffe reaches them. So, in a sense, the trees are warning each other. Giraffes seem to have learned this. They usually eat from one tree for only a short time, and then they move upwind, to trees that haven't received the warning yet."},{"speaker":"N","text":"Question 7. What is the lecture mainly about?"},{"speaker":"N","text":"Question 8. What does tannin do?"},{"speaker":"N","text":"Question 9. According to the professor, how do nearby trees respond to the gas?"},{"speaker":"N","text":"Question 10. Why do giraffes move upwind?"}],"items":[{"id":"L7","type":"講義の主題","choices":["How plants defend themselves.","How giraffes find water.","Why acacia trees grow in Africa.","How gases travel in the air."],"answer":0,"explain":"最初の1文 how some plants protect themselves がそのまま主題。講義は冒頭で主題を言うことが多い。"},{"id":"L8","type":"講義の詳細","choices":["It makes leaves taste bitter.","It helps leaves grow faster.","It attracts giraffes.","It changes the color of leaves."],"answer":0,"explain":"which makes the leaves taste bitter と言っている。関係詞の後ろに答えが来る。"},{"id":"L9","type":"講義の詳細","choices":["They drop their leaves.","They release more gas.","They start producing tannin.","They stop growing."],"answer":2,"explain":"start producing tannin too。too で「最初の木と同じことをする」とわかる。"},{"id":"L10","type":"講義の理由","choices":["To avoid strong winds.","To reach trees that are not yet bitter.","To follow other giraffes.","To find taller trees."],"answer":1,"explain":"trees that haven't received the warning yet＝まだ苦くなっていない木。ガスは風下へ流れるので、風上の木はまだ警告を受けていない。"}]}]},{"id":"structure","title":"Structure","pace_sec":37,"instructions":"前半5問は空所に入るものを選ぶ。後半5問は下線のうち誤っているものを1つ選ぶ。","groups":[{"id":"S1","items":[{"id":"S1","kind":"blank","type":"動詞の抜け","stem":"The Grand Canyon ______ more than 400 kilometers long.","choices":["it is","being","is","which is"],"answer":2,"explain":"主語 The Grand Canyon に動詞が無い。being は動詞にならず、it is は主語が2つになり、which is だと文が終わらない。"}]},{"id":"S2","items":[{"id":"S2","kind":"blank","type":"節をつなぐ接続詞","stem":"______ was first discovered in 1930, Pluto was considered the ninth planet for more than 70 years.","choices":["It","It was","Because of","After it"],"answer":3,"explain":"カンマの後ろに完全な文（Pluto was considered…）がある。前半を節にするには接続詞＋主語が要る。Because of の後ろは名詞だけ。"}]},{"id":"S3","items":[{"id":"S3","kind":"blank","type":"the first ＋ to 不定詞","stem":"Marie Curie was the first person ______ two Nobel Prizes.","choices":["to win","won","she won","who she won"],"answer":0,"explain":"the first person to do で「最初に〜した人」。who won なら正しいが、who she won は主語が余る。"}]},{"id":"S4","items":[{"id":"S4","kind":"blank","type":"倒置","stem":"Not only ______ an important source of food, but it also provides jobs for millions of people.","choices":["rice is","rice being","is rice","does rice"],"answer":2,"explain":"Not only が文頭に来ると疑問文の語順になる。be 動詞の文なので is rice。does rice は一般動詞のとき。"}]},{"id":"S5","items":[{"id":"S5","kind":"blank","type":"the 比較級, the 比較級","stem":"The higher you climb on a mountain, ______ the air becomes.","choices":["thin","thinner than","the thinnest","the thinner"],"answer":3,"explain":"The 比較級〜, the 比較級… で「〜するほど…」。前半に The higher があるので後半も the＋比較級。"}]},{"id":"W1","items":[{"id":"W1","kind":"error","type":"主語と動詞の一致","parts":["The ",{"u":"number"}," of students ",{"u":"who"}," study abroad ",{"u":"have"}," increased ",{"u":"sharply"}," in recent years."],"choices":["number","who","have","sharply"],"answer":2,"explain":"主語は The number（数）で単数。have ではなく has。間の of students に引きずられる誤り。"}]},{"id":"W2","items":[{"id":"W2","kind":"error","type":"並列","parts":["Swimming ",{"u":"is"}," good for ",{"u":"building"}," strength, ",{"u":"improving"}," balance, and ",{"u":"to reduce"}," stress."],"choices":["is","building","improving","to reduce"],"answer":3,"explain":"and で並ぶものは同じ形にそろえる。building, improving と来ているので reducing。"}]},{"id":"W3","items":[{"id":"W3","kind":"error","type":"形容詞と副詞","parts":["The scientist ",{"u":"explained"}," ",{"u":"the results"}," ",{"u":"to"}," the audience very ",{"u":"clear"},"."],"choices":["explained","the results","to","clear"],"answer":3,"explain":"動詞 explained を説明するのは副詞。clear ではなく clearly。"}]},{"id":"W4","items":[{"id":"W4","kind":"error","type":"代名詞の一致","parts":["Bees ",{"u":"use"}," the position of the sun to find ",{"u":"its"}," way ",{"u":"back"}," to ",{"u":"the hive"},"."],"choices":["use","its","back","the hive"],"answer":1,"explain":"指しているのは Bees（複数）なので their。近くにある the sun に引きずられる誤り。"}]},{"id":"W5","items":[{"id":"W5","kind":"error","type":"受け身の形","parts":["The oldest buildings in the city ",{"u":"were build"}," ",{"u":"during"}," the ",{"u":"nineteenth"}," century, ",{"u":"when"}," trade was growing."],"choices":["were build","during","nineteenth","when"],"answer":0,"explain":"受け身は be＋過去分詞。build の過去分詞は built。"}]}]},{"id":"reading","title":"Reading","pace_sec":66,"instructions":"文章を読んで、それぞれ5問に答える。本文はいつでも見返してよい。","groups":[{"id":"R1-5","passage_title":"Paper Money in China","passage":["Paper money first appeared in China about a thousand years ago. In the province of Sichuan, people mainly used coins made of iron, which was much cheaper than copper. Because iron coins had so little value, even a small purchase required a large number of them, and a merchant might have to carry a heavy load of coins just to buy a single roll of cloth.","To solve this problem, merchants in the city of Chengdu began to leave their heavy coins with trusted shops. In return, they received paper receipts, which they could exchange for coins later. Soon people realized that the receipts themselves could be used to pay for goods. These receipts, known as jiaozi, were far easier to carry and quickly became popular.","However, some shops issued more receipts than they could actually pay back, and many people lost their money. In 1023, the Song government took control of the system and began issuing jiaozi itself. Official paper money was a remarkable invention, but it also created a new temptation. When the government needed funds, it could simply print more notes, and over time this led to rising prices."],"items":[{"id":"R1","type":"主題","question":"What does the passage mainly discuss?","choices":["The history of the silk trade in China","How paper money developed in China","Why copper became valuable","How the Song government collected taxes"],"answer":1,"explain":"3段落とも紙幣の始まり→広がり→政府の管理という流れ。1段落だけの話（鉄銭）を選ばない。"},{"id":"R2","type":"語彙","question":"The word \"trusted\" in paragraph 2 is closest in meaning to","choices":["reliable","famous","wealthy","nearby"],"answer":0,"explain":"大事な硬貨を預ける相手＝信用できる店。trust（信頼する）から形を推測できる。"},{"id":"R3","type":"詳細","question":"According to the passage, why were iron coins inconvenient?","choices":["They broke easily.","They could not be used outside Sichuan.","Many of them were needed even for small purchases.","Merchants refused to accept them."],"answer":2,"explain":"even a small purchase required a large number of them の言い換え。本文に無いことを言う選択肢は消す。"},{"id":"R4","type":"指示語","question":"The word \"they\" in the phrase \"which they could exchange\" in paragraph 2 refers to","choices":["coins","shops","receipts","merchants"],"answer":3,"explain":"受け取った証書を硬貨に替えられるのは、硬貨を預けた商人。they received と同じ they。"},{"id":"R5","type":"推測","question":"What can be inferred about printing more notes?","choices":["It made each note worth less.","It was forbidden by law.","It increased the use of iron coins.","It was done only by private shops."],"answer":0,"explain":"刷りすぎると物価が上がる（rising prices）＝お札1枚で買える量が減る。書いていないが言える、が推測問題。"}]},{"id":"R6-10","passage_title":"Sleep and Memory","passage":["Scientists have long known that sleep is important for health, but only recently have they begun to understand its role in memory. During the day, the brain takes in a huge amount of information. Much of this information is stored temporarily in a region called the hippocampus, which has limited space.","Research suggests that during deep sleep, the brain replays the day's experiences. As this happens, important memories are gradually moved from the hippocampus to the cortex, where they can be kept for a long time. In several studies, people who slept after learning a list of words remembered more of them the next day than people who stayed awake for the same amount of time.","These findings have practical implications. Students who stay up all night before an exam may feel that they are using their time efficiently. In fact, by giving up sleep, they may be preventing the brain from storing the very information they worked so hard to learn."],"items":[{"id":"R6","type":"主題","question":"The passage mainly explains","choices":["why people dream","the structure of the hippocampus","how sleep helps the brain store memories","how to study more efficiently at night"],"answer":2,"explain":"1文目の its role in memory（睡眠が記憶に果たす役割）が主題。"},{"id":"R7","type":"語彙","question":"The word \"temporarily\" in paragraph 1 is closest in meaning to","choices":["carefully","for a short time","completely","by accident"],"answer":1,"explain":"海馬は容量が小さく、後で皮質へ移す＝一時的に置く。temporary（一時的な）の副詞。"},{"id":"R8","type":"詳細","question":"According to the passage, where can memories be kept for a long time?","choices":["In the cortex","In the hippocampus","In both areas equally","The passage does not say."],"answer":0,"explain":"to the cortex, where they can be kept for a long time。where の後ろが答え。"},{"id":"R9","type":"詳細","question":"According to the studies, people who slept after learning a list of words","choices":["learned the words more quickly","needed less sleep afterward","forgot more of the words","remembered more of the words the next day"],"answer":3,"explain":"remembered more of them the next day。A は「覚える速さ」で、本文が比べているのは翌日の量。"},{"id":"R10","type":"筆者の主張","question":"What does the author suggest about staying up all night before an exam?","choices":["It is an efficient use of time.","It may reduce how much students remember.","It helps the hippocampus store more.","It is common only among good students."],"answer":1,"explain":"may feel … efficiently の直後に In fact で否定している。In fact・However の後ろが筆者の本音。"}]}]}],"curriculum_map":{"動詞の抜け":"11月第1週","節をつなぐ接続詞":"11月第1週","the first ＋ to 不定詞":"11月第2週","倒置":"11月第3週","the 比較級, the 比較級":"11月第3週","主語と動詞の一致":"11月第1週","並列":"11月第2週","形容詞と副詞":"11月第2週","代名詞の一致":"11月第4週","受け身の形":"11月第4週","理由の言い換え":"12月第1週","提案の表現":"12月第1週","否定＋比較級":"12月第2週","慣用句":"12月第3週","仮定法":"12月第2週","準否定語":"12月第2週","講義の主題":"1月第3週","講義の詳細":"1月第3週","講義の理由":"1月第3週","主題":"1月第1週","語彙":"1月第1週","詳細":"1月第2週","指示語":"1月第1週","推測":"1月第2週","筆者の主張":"1月第2週"}}</script>
<script>
'use strict';
const DATA = JSON.parse(document.getElementById('question-data').textContent);
const SECTIONS = DATA.sections.map(s => ({...s, questions:s.groups.flatMap(g => g.items.map(q => ({q,g})))}));
const KEY = 'toefl-itp-diagnostic-v1-113a3d635761a8aa';
const LETTERS = ['A','B','C','D'];
const app = document.getElementById('app');
const player = new Audio();
player.preload = 'metadata';
let state, anchor = null, currentAudio = null, playBusy = false, playbackError = '', renderedPassage = null;
function localDate(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function firstSec(s){return s&&s.mode==='nolisten'?1:0;}
function activeSecs(){return SECTIONS.filter((_,i)=>i>=firstSec(state));}
function fresh(){return {schema:1,mode:'full',phase:'cover',section:0,index:0,answers:{},elapsed:SECTIONS.map(()=>0),played:{},date:localDate()};}
function valid(s){
 if(!s || s.schema!==1 || !['cover','active','between','results'].includes(s.phase))return false;
 if(s.mode===undefined)s.mode='full';
 if(!['full','nolisten'].includes(s.mode))return false;
 const f0=firstSec(s);
 if(!Number.isInteger(s.section)||s.section<0||s.section>=SECTIONS.length||!Number.isInteger(s.index)||s.index<0||s.index>=SECTIONS[s.section].questions.length)return false;
 if(!s.answers||typeof s.answers!=='object'||Array.isArray(s.answers)||!s.played||typeof s.played!=='object'||Array.isArray(s.played))return false;
 if(!Array.isArray(s.elapsed)||s.elapsed.length!==SECTIONS.length||s.elapsed.some(x=>!Number.isFinite(x)||x<0))return false;
 if(typeof s.date!=='string'||!/^\d{4}-\d{2}-\d{2}$/.test(s.date))return false;
 const all=SECTIONS.flatMap(s=>s.questions);
 const req=SECTIONS.slice(f0).flatMap(s=>s.questions);
 for(const [id,a] of Object.entries(s.answers)){const item=all.find(x=>x.q.id===id);if(!item||!Number.isInteger(a)||a<0||a>=item.q.choices.length)return false;}
 const groups=SECTIONS[0].groups;
 for(const [id,p] of Object.entries(s.played)){if(!groups.some(g=>g.id===id)||!p||typeof p.started!=='boolean'||typeof p.ended!=='boolean'||!Number.isFinite(p.position)||p.position<0)return false;}
 if(s.phase!=='cover'&&s.section<f0)return false;
 const cursor=SECTIONS.slice(f0,s.section).reduce((n,s)=>n+s.questions.length,0)+s.index;
 if(s.phase==='active'&&req.slice(0,cursor).some(x=>s.answers[x.q.id]===undefined))return false;
 if(s.phase==='between'&&(s.section===f0||s.index!==0||req.slice(0,cursor).some(x=>s.answers[x.q.id]===undefined)))return false;
 if(s.phase==='results'&&req.some(x=>s.answers[x.q.id]===undefined))return false;
 return true;
}
function storageFailed(){document.getElementById('storage-note').hidden=false;}
function load(){try{const raw=localStorage.getItem(KEY);if(raw){const saved=JSON.parse(raw);if(valid(saved))return saved;}}catch(e){storageFailed();}return fresh();}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){storageFailed();}}
function tick(){const now=performance.now();if(anchor!==null&&state.phase==='active')state.elapsed[state.section]+=(now-anchor)/1000;anchor=state.phase==='active'&&!document.hidden?now:null;}
function el(tag,attrs={},text){const n=document.createElement(tag);for(const [k,v] of Object.entries(attrs)){if(k==='class')n.className=v;else n.setAttribute(k,v);}if(text!==undefined)n.textContent=text;return n;}
function btn(text,handler,cls='primary'){const n=el('button',{type:'button',class:cls},text);n.addEventListener('click',handler);return n;}
function focusHeading(){const h=app.querySelector('[data-focus]');if(h)h.focus({preventScroll:true});}
function heading(tag,text){return el(tag,{tabindex:'-1','data-focus':''},text);}
function resetView(){renderedPassage=null;app.replaceChildren();}
function start(mode){state.mode=mode;state.section=firstSec(state);state.index=0;state.phase='active';state.date=localDate();anchor=document.hidden?null:performance.now();save();render();}
function renderCover(){resetView();const box=el('section',{class:'cover stack large-gap'});box.append(el('p',{class:'eyebrow'},'いま、どの型で迷う？'),heading('h1','TOEFL ITP 診断'),el('p',{class:'intro'},'解いてみて、見直したい型を確かめよう。音を出せないときは、リスニングなしでも受けられる。'));
 const facts=el('div',{class:'facts'});for(const [value,label] of [['30問','リスニングあり・約25分'],['20問','リスニングなし・約17分'],['各10問','Listening / Structure / Reading']]){const f=el('div',{class:'fact'});f.append(el('strong',{},value),el('span',{},label));facts.append(f);}box.append(facts);
 const note=el('div',{class:'notice stack'});note.append(el('p',{},'音声は各グループ1回だけです。選択して「次へ」を押すと、前の問題には戻れません。'),el('p',{},'回答と経過時間は、このブラウザに保存します。閉じている間と、別のタブを見ている間は計時しません。'),el('p',{},'問題はオリジナルで、ETSとは関係ありません。'));const acts=el('div',{class:'actions'});acts.append(btn('リスニングありで始める',()=>start('full')),btn('リスニングなしで始める',()=>start('nolisten'),'secondary'));box.append(note,acts);app.append(box);}
function renderBetween(){resetView();const sec=SECTIONS[state.section];const box=el('section',{class:'between stack large-gap'});box.append(el('p',{class:'eyebrow'},SECTIONS[state.section-1].title+' が終わりました'),heading('h1','次は '+sec.title),el('p',{},sec.instructions),el('p',{class:'small'},'全10問。「始める」を押すと計時します。'),btn(sec.title+' を始める',()=>{state.phase='active';anchor=document.hidden?null:performance.now();save();render();}));app.append(box);}
function continuationHint(q){return typeof q.question==='string'&&q.question.trim()&&!q.question.trim().endsWith('?')?el('p',{class:'small continuation-hint'},'（文の続きに合うものを選ぶ）'):null;}
function appendQuestion(target,q,cls='english question-title'){if(typeof q.question!=='string')return;target.append(el('p',{class:cls,lang:'en'},q.question));const hint=continuationHint(q);if(hint)target.append(hint);}
function sentence(q){const p=el('p',{class:'english question-title',lang:'en'});if(q.kind==='error'){let i=0;for(const part of q.parts){if(typeof part==='string')p.append(document.createTextNode(part));else{const span=el('span',{class:'marked'});span.append(el('u',{},part.u),el('span',{class:'part-label'},LETTERS[i++]));p.append(span);}}}else{q.stem.split('______').forEach((part,i)=>{if(i)p.append(el('span',{class:'blank','aria-label':'空欄'},'\u00a0'));p.append(document.createTextNode(part));});}return p;}
function audioState(id){return state.played[id]||{started:false,ended:false,position:0};}
function snapshotAudio(){if(currentAudio){const p=state.played[currentAudio];if(p&&p.started&&Number.isFinite(player.currentTime))p.position=Math.max(p.position,player.currentTime);}}
function audioActive(){return !!currentAudio&&!player.error&&!player.paused&&!player.ended;}
function updateAudioUI(){const b=document.getElementById('play-audio');const item=SECTIONS[state.section]?.questions[state.index];if(!b||state.phase!=='active'||!item)return;const {g}=item;const p=audioState(g.id);b.disabled=playBusy||p.ended||(currentAudio===g.id&&audioActive());b.textContent=p.ended?'再生済み':playBusy?'読み込み中…':currentAudio===g.id&&audioActive()?'再生中':p.started?'音声の続きを再生':'再生';const status=document.getElementById('audio-status');if(status){status.textContent=playbackError||(p.ended?'音声が終わりました。':p.started&&!audioActive()?'保存した位置から続けられます。':'音声は1回だけ再生できます。');status.className='small'+(playbackError?' error':'');}updateNext();}
async function playGroup(g){if(playBusy)return;const prior=audioState(g.id);if(prior.ended||(currentAudio===g.id&&audioActive()))return;playBusy=true;playbackError='';updateAudioUI();
 try{if(currentAudio!==g.id||player.error){player.pause();currentAudio=g.id;player.src=g.audio;player.load();}if(prior.position>0)player.currentTime=prior.position;await player.play();state.played[g.id]={started:true,ended:false,position:Math.max(prior.position,player.currentTime||0)};save();}
 catch(e){playbackError='音声を再生できませんでした。音声ファイルと接続を確認して、もう一度押してください。';}
 finally{playBusy=false;updateAudioUI();}
}
function canAdvance(){const sec=SECTIONS[state.section],{q,g}=sec.questions[state.index];if(state.answers[q.id]===undefined)return false;if(sec.id!=='listening')return true;const p=audioState(g.id);if(!p.started)return false;const following=sec.questions[state.index+1];return !!following&&following.g.id===g.id||p.ended;}
function updateNext(){const b=document.getElementById('next');if(b)b.disabled=!canAdvance();}
function renderQuestion(){const sec=SECTIONS[state.section],{q,g}=sec.questions[state.index];const keepPassage=sec.id==='reading'&&renderedPassage===g.id&&document.getElementById('question-pane');
 if(!keepPassage){resetView();const head=el('section',{class:'section-head'});const meta=el('div',{class:'section-meta small'});meta.append(el('span',{},'セクション '+(state.section+1-firstSec(state))+' / '+activeSecs().length),el('span',{id:'timer'},''));const title=el('div',{class:'section-title'});title.append(el('h1',{},sec.title),el('span',{id:'question-count',class:'small'}));head.append(meta,title,el('progress',{class:'progress',id:'progress',max:sec.questions.length,value:state.index,'aria-label':sec.title+' の回答済み問題数'}),el('p',{class:'small'},sec.instructions));app.append(head);
 const layout=el('div',{class:'question-layout'+(sec.id==='reading'?' reading-layout':'')});if(sec.id==='reading'){const passage=el('aside',{class:'passage','aria-labelledby':'passage-title'});passage.append(el('h2',{id:'passage-title',class:'question-title',lang:'en'},g.passage_title));const copy=el('div',{class:'passage-copy',tabindex:'0','aria-label':'Readingの本文',lang:'en'});g.passage.forEach((text,i)=>{const p=el('p');p.append(el('span',{class:'passage-number','aria-hidden':'true'},String(i+1)),document.createTextNode(text));copy.append(p);});passage.append(copy);layout.append(passage);renderedPassage=g.id;}layout.append(el('section',{class:'question-pane',id:'question-pane'}));app.append(layout);}
 document.getElementById('question-count').textContent=(state.index+1)+' / '+sec.questions.length+'問';document.getElementById('progress').value=state.index;const pane=document.getElementById('question-pane');pane.replaceChildren();pane.append(heading('h2','問題 '+q.id));
 if(sec.id==='listening'){const tools=el('div',{class:'listening-tools'});const play=btn('再生',()=>playGroup(g),'secondary');play.id='play-audio';tools.append(play,el('p',{id:'audio-status',class:'small',role:'status'}));if(g.items.length>1)tools.append(el('p',{class:'small'},'L7〜L10は1本の音声です。質問のあとの8秒間に答えて「次へ」を押してください。'));pane.append(tools);appendQuestion(pane,q);}else if(sec.id==='structure'){pane.append(el('p',{class:'small'},q.kind==='error'?'下線A〜Dから、誤っているものを選んでください。':'空欄に入るものを選んでください。'),sentence(q));}else appendQuestion(pane,q);
 const choices=el('fieldset');choices.append(el('legend',{class:'sr-only'},'問題 '+q.id+' の選択肢'));q.choices.forEach((text,i)=>{const label=el('label',{class:'choice'});const input=el('input',{type:'radio',name:'answer',value:i});input.checked=state.answers[q.id]===i;input.addEventListener('change',()=>{state.answers[q.id]=i;tick();save();updateNext();});label.append(input,el('span',{class:'choice-letter'},LETTERS[i]));if(q.kind!=='error')label.append(el('span',{class:'choice-text',lang:'en'},text));else input.setAttribute('aria-label',LETTERS[i]+': '+text);choices.append(label);});pane.append(choices);
 const row=el('div',{class:'next-row'});const b=btn(state.index===sec.questions.length-1?(state.section===SECTIONS.length-1?'結果を見る':'次のセクションへ'):'次へ',next);b.id='next';row.append(b);pane.append(row);if(sec.id==='listening')updateAudioUI();updateNext();showTimer();}
function stopAudio(){snapshotAudio();player.pause();currentAudio=null;player.removeAttribute('src');player.load();playbackError='';playBusy=false;}
function next(){if(!canAdvance())return;tick();snapshotAudio();const sec=SECTIONS[state.section],oldGroup=sec.questions[state.index].g.id;state.index++;if(state.index>=sec.questions.length){stopAudio();state.index=0;state.section++;anchor=null;if(state.section>=SECTIONS.length){state.section=SECTIONS.length-1;state.phase='results';}else state.phase='between';}else if(sec.questions[state.index].g.id!==oldGroup)stopAudio();save();render();}
function showTimer(){const n=document.getElementById('timer');if(n){const seconds=Math.floor(state.elapsed[state.section]);n.textContent='経過 '+Math.floor(seconds/60)+':'+String(seconds%60).padStart(2,'0');}}
function scores(){return SECTIONS.map((sec,i)=>({sec,i})).filter(({i})=>i>=firstSec(state)).map(({sec,i})=>({sec,correct:sec.questions.filter(({q})=>state.answers[q.id]===q.answer).length,seconds:Math.round(state.elapsed[i]),delta:Math.round(state.elapsed[i]-sec.pace_sec*sec.questions.length)}));}
function wrong(){return activeSecs().flatMap(sec=>sec.questions.filter(({q})=>state.answers[q.id]!==q.answer).map(item=>({...item,sec})));}
function copyText(){const lines=['TOEFL ITP 診断 v'+DATA.version+' / '+state.date+(state.mode==='nolisten'?'（リスニングなし）':'')];for(const r of scores())lines.push(r.sec.title+' '+r.correct+'/'+r.sec.questions.length+(r.sec.id==='listening'?'':'（ペース '+(r.delta>=0?'+':'')+r.delta+'秒）'));lines.push('間違えた: '+(wrong().map(({q})=>q.id+' '+q.type).join(', ')||'なし'));return lines.join('\n');}
function answerText(q,index){return LETTERS[index]+'. '+q.choices[index];}
function transcript(g){const box=el('div',{class:'transcript'});box.append(el('h3',{},'音声の全文'));for(const line of g.script)box.append(el('p',{class:'script-line',lang:'en'},line.speaker+': '+line.text));return box;}
async function copyResult(){const status=document.getElementById('copy-status');try{if(!navigator.clipboard||!navigator.clipboard.writeText)throw new Error('unavailable');await navigator.clipboard.writeText(copyText());status.textContent='結果をコピーしました。';}catch(e){status.textContent='自動でコピーできませんでした。下のテキストを選んでコピーしてください。';const area=document.getElementById('copy-fallback');area.hidden=false;area.value=copyText();area.focus();area.select();}}
function restart(){stopAudio();state=fresh();anchor=null;save();render();}
function renderResults(){resetView();const box=el('section',{class:'results'});box.append(el('p',{class:'eyebrow'},activeSecs().reduce((n,x)=>n+x.questions.length,0)+'問、おつかれさまでした'),heading('h1','診断結果'),el('p',{class:'small'},'問題数が少なく誤差が大きいので、ITP の点数には換算していない。'));
 const scoreList=el('div',{class:'score-list'});for(const r of scores()){const card=el('section',{class:'score'});card.append(el('h2',{},r.sec.title),el('strong',{},r.correct+'/'+r.sec.questions.length));if(r.sec.id!=='listening')card.append(el('p',{class:'small'},r.delta===0?'本番ペースと同じ':('本番ペースより'+Math.abs(r.delta)+'秒'+(r.delta>0?'遅い':'速い'))),el('p',{class:'small'},'経過 '+r.seconds+'秒 / 本番ペース '+r.sec.pace_sec*r.sec.questions.length+'秒'));scoreList.append(card);}box.append(scoreList,el('p',{class:'small'},'ペースは「1問の目安 × 問題数」との差。'+(state.mode==='nolisten'?'':'Listening は音声の長さで決まるので出していない。')));
 const actions=el('div',{class:'actions'});actions.append(btn('結果をコピー',copyResult),btn('もう一度',restart,'secondary'));box.append(actions,el('p',{id:'copy-status',class:'small',role:'status'}));const fallback=el('textarea',{id:'copy-fallback',class:'copy-text','aria-label':'コピー用の診断結果',readonly:''});fallback.hidden=true;box.append(fallback);
 const missed=wrong();const study=el('section',{class:'stack'});study.append(el('h2',{},'見直したい型'));if(missed.length){const list=el('ul',{class:'curriculum'});for(const type of new Set(missed.map(({q})=>q.type)))list.append(el('li',{},type+' — この型を扱う回: '+(DATA.curriculum_map[type]||'未登録')));study.append(list);}else study.append(el('p',{},'全問正解です。間違えた型はありません。'));box.append(study);
 const review=el('section',{class:'stack'});review.append(el('h2',{},'間違えた問題'));if(!missed.length)review.append(el('p',{},'間違えた問題はありません。'));
 for(const {q,g,sec} of missed){const item=el('article',{class:'review-item'});item.append(el('h3',{},q.id+' / '+sec.title),el('p',{class:'small'},'型: '+q.type));if(sec.id==='structure')item.append(sentence(q));else if(sec.id==='reading'){appendQuestion(item,q,'english');const passage=el('details');passage.append(el('summary',{},'本文を読む'));for(const text of g.passage)passage.append(el('p',{class:'english',lang:'en'},text));item.append(passage);}else if(typeof q.question==='string')appendQuestion(item,q,'english');else item.append(el('p',{},'問題は下の音声全文にある質問です。'));
 const options=el('ol',{class:'review-choices',type:'A',lang:'en'});for(const option of q.choices)options.append(el('li',{},option));item.append(options);const answers=el('dl',{class:'answers'});for(const [label,value] of [['自分の答え',answerText(q,state.answers[q.id])],['正解',answerText(q,q.answer)]]){const pair=el('div');pair.append(el('dt',{},label),el('dd',{lang:'en'},value));answers.append(pair);}item.append(answers,el('p',{},q.explain));if(sec.id==='listening')item.append(transcript(g));review.append(item);}box.append(review);
 const allScripts=el('details',{class:'stack'});allScripts.append(el('summary',{},'Listeningの音声全文をすべて読む'));for(const g of SECTIONS[0].groups){const s=el('section',{class:'stack'});s.append(el('h3',{},g.id),transcript(g));allScripts.append(s);}if(state.mode!=='nolisten')box.append(allScripts);app.append(box);}
function render(){if(state.phase==='cover')renderCover();else if(state.phase==='between')renderBetween();else if(state.phase==='results')renderResults();else renderQuestion();focusHeading();}
player.addEventListener('timeupdate',()=>{snapshotAudio();save();});
player.addEventListener('ended',()=>{if(currentAudio&&state.played[currentAudio]){snapshotAudio();state.played[currentAudio].ended=true;save();}updateAudioUI();});
player.addEventListener('pause',()=>{snapshotAudio();save();updateAudioUI();});
player.addEventListener('error',()=>{if(currentAudio){playbackError='音声を読み込めませんでした。audioフォルダのMP3を確認してください。';updateAudioUI();}});
document.addEventListener('visibilitychange',()=>{tick();if(document.hidden){snapshotAudio();player.pause();}save();updateAudioUI();});
window.addEventListener('pagehide',()=>{tick();snapshotAudio();save();});
state=load();anchor=state.phase==='active'&&!document.hidden?performance.now():null;render();
setInterval(()=>{tick();showTimer();save();},1000);
</script>
</body>
</html>
